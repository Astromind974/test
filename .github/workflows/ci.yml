name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Tests Python : animal_identifier + database (sans Flask)
  # ---------------------------------------------------------------------------
  test-python:
    name: Tests Python (IA)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy requests
          pip install -r requirements-dev.txt

      - name: 🧪 Tests Python (animal_identifier + database)
        run: |
          pytest tests/test_animal_identifier.py tests/test_database.py --tb=short

  # ---------------------------------------------------------------------------
  # Tests Node.js : backend Express
  # ---------------------------------------------------------------------------
  test-backend:
    name: Tests Node.js (backend)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Installation des dépendances backend
        run: cd backend && npm ci

      - name: 🧪 Tests backend (Jest)
        run: cd backend && npm test

  # ---------------------------------------------------------------------------
  # Build frontend React
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend (React/Vite)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Installation des dépendances frontend
        run: cd frontend && npm ci

      - name: 🏗️ Build production
        run: cd frontend && npm run build

  # ---------------------------------------------------------------------------
  # Vérification des fichiers essentiels
  # ---------------------------------------------------------------------------
  check-files:
    name: Vérification des fichiers essentiels
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔍 Vérification des fichiers clés
        run: |
          echo "✅ Vérification de la présence des fichiers clés..."
          test -f README.md              && echo "README.md ✓"              || (echo "README.md manquant ✗" && exit 1)
          test -f LICENSE                && echo "LICENSE ✓"                || (echo "LICENSE manquant ✗" && exit 1)
          test -f .gitignore             && echo ".gitignore ✓"             || (echo ".gitignore manquant ✗" && exit 1)
          test -f animal_identifier.py   && echo "animal_identifier.py ✓"   || (echo "animal_identifier.py manquant ✗" && exit 1)
          test -f database.py            && echo "database.py ✓"            || (echo "database.py manquant ✗" && exit 1)
          test -f ai_service/main.py     && echo "ai_service/main.py ✓"     || (echo "ai_service/main.py manquant ✗" && exit 1)
          test -f backend/src/index.js   && echo "backend/src/index.js ✓"   || (echo "backend/src/index.js manquant ✗" && exit 1)
          test -f frontend/src/App.jsx   && echo "frontend/src/App.jsx ✓"   || (echo "frontend/src/App.jsx manquant ✗" && exit 1)
          echo "✅ Tous les fichiers essentiels sont présents."

      - name: 📋 Informations sur le dépôt
        run: |
          echo "Branche : ${{ github.ref_name }}"
          echo "Commit  : ${{ github.sha }}"
          echo "Auteur  : ${{ github.actor }}"

  # ---------------------------------------------------------------------------
  # Synchronisation vers WildTrack-Studio/Prototype (uniquement sur push, si tout est OK)
  # ---------------------------------------------------------------------------
  sync-to-target-repo:
    name: 🚀 Sync vers WildTrack-Studio/Prototype
    needs: [test-python, test-backend, build-frontend, check-files]
    runs-on: ubuntu-latest
    # Ne s'exécute que sur les push (pas sur les pull_request)
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout complet du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 Push vers WildTrack-Studio/Prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add target https://x-access-token:${TARGET_REPO_TOKEN}@github.com/WildTrack-Studio/Prototype.git
          git push target HEAD:${{ github.ref_name }} --force-with-lease
        env:
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
