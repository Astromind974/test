name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install Flask Pillow numpy requests
          pip install -r requirements-dev.txt

      - name: 🔍 Vérification des fichiers essentiels
        run: |
          echo "✅ Vérification de la présence des fichiers clés..."
          test -f README.md    && echo "README.md ✓"   || (echo "README.md manquant ✗" && exit 1)
          test -f LICENSE      && echo "LICENSE ✓"     || (echo "LICENSE manquant ✗"    && exit 1)
          test -f .gitignore   && echo ".gitignore ✓"  || (echo ".gitignore manquant ✗" && exit 1)
          echo "✅ Tous les fichiers essentiels sont présents."

      - name: 🧪 Exécution des tests unitaires
        run: |
          pytest --tb=short

      - name: 📋 Informations sur le dépôt
        run: |
          echo "Branche : ${{ github.ref_name }}"
          echo "Commit  : ${{ github.sha }}"
          echo "Auteur  : ${{ github.actor }}"
